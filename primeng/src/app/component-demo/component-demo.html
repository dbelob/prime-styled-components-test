<h1>PrimeNG (without Tailwind)</h1>
<div style="margin: 1rem 0 1rem 0">
  <button pButton>Check</button>
</div>
<div style="margin: 1rem 0 1rem 0">
  <input type="text" pInputText [(ngModel)]="inputTextValue" placeholder="Enter text" />
</div>
<div style="margin: 1rem 0 1rem 0">
  <p-select
    [options]="languages"
    [(ngModel)]="selectedLanguage"
    optionLabel="label"
    optionValue="value"
    placeholder="Select a language"
  />
</div>
