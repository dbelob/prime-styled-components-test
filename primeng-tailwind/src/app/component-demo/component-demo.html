<div class="text-3xl font-bold">PrimeNG (with Tailwind)</div>
<div class="my-4">
  <button pButton>Check</button>
</div>
<div class="my-4">
  <input type="text" pInputText [(ngModel)]="inputTextValue" placeholder="Enter text" />
</div>
<div class="my-4">
  <p-select
    [options]="languages"
    [(ngModel)]="selectedLanguage"
    optionLabel="label"
    optionValue="value"
    placeholder="Select a language"
  />
</div>
